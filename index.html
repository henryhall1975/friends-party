<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a1d8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Friends Party">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Friends Party: fotos de tus reuniones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3FA;--surface:#FFFFFF;--ink:#1E1B3A;--muted:#6B6890;--line:#E2DEEF;
  --brand:#2B2A6B;--on-brand:#FFFFFF;--accent:#D6336C;--sun:#F6B93B;--danger:#C0264F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14122B;--surface:#1F1C42;--ink:#F1EFFB;--muted:#A6A2CC;--line:#35325F;
    --brand:#F6B93B;--on-brand:#1E1B3A;--accent:#FF6B9A;--danger:#FF7D9C;
  }
}
:root[data-theme="dark"]{
  --bg:#14122B;--surface:#1F1C42;--ink:#F1EFFB;--muted:#A6A2CC;--line:#35325F;
  --brand:#F6B93B;--on-brand:#1E1B3A;--accent:#FF6B9A;--danger:#FF7D9C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
svg{flex:none}

/* Inicio */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:28px 0 18px}
.hero h1{margin:0;font-size:40px;line-height:1.02;font-weight:800;letter-spacing:-.035em}
.hero .h1g{background:linear-gradient(90deg,#6B7BFF,#B36BFF);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tagl{margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.lead{margin:8px 0 0;color:var(--muted);max-width:26ch}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:10px;padding:12px 14px;margin:0 0 18px}
.note p{margin:0 0 6px;font-size:15px}
.link{color:var(--accent);font-weight:700;padding:8px 0;text-align:left}
.link.danger{color:var(--danger)}
.list{display:grid;gap:16px;padding-bottom:110px}
.ecard{display:block;position:relative;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;padding:0;color:inherit}
.ecard:active{transform:scale(.99)}
.ecover{position:relative;height:150px;background-size:cover;background-position:center;display:grid;place-items:start center;padding-top:18px;font-size:60px;line-height:1}
.ecover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent,var(--surface))}
.ecount{position:absolute;top:12px;right:12px;z-index:2;font-size:13px;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:3px 12px}
.ebody{position:relative;z-index:1;display:grid;grid-template-columns:76px 1fr;gap:14px;padding:0 16px 16px;margin-top:-40px}
.edate{align-self:start;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;display:grid;gap:1px}
.edate small{text-transform:uppercase;font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.edate b{font-size:30px;line-height:1.05;font-weight:800}
.et{font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.einfo{min-width:0}
.erow{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-top:5px}
.erow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.epeople{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.eav{display:flex}.eav .av{border:2px solid var(--surface)}.eav .av+.av{margin-left:-8px}
.card{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card:active{transform:scale(.99)}
.stack{position:relative;width:96px;height:88px;flex:none}
.stack .p{position:absolute;width:66px;background:#fff;padding:4px 4px 13px;box-shadow:0 2px 8px rgba(20,18,43,.28);border-radius:2px}
.stack .p img,.stack .p .ph{display:block;width:100%;height:50px;object-fit:cover}
.stack .p .ph{display:grid;place-items:center;font-size:28px}
.ct{min-width:0}
.ct .t{font-weight:700;font-size:18px;line-height:1.2;letter-spacing:-.01em}
.ct .s{color:var(--muted);font-size:14px;margin-top:2px}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.empty{text-align:center;padding:48px 16px}
.empty p{margin:0 0 4px}

/* Barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.sq{width:46px;padding:0}
.btn[disabled]{opacity:.4}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none}

/* Evento */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:6px;padding:10px 0 6px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:var(--line)}
.tt{min-width:0}
.ttl{font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:12px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:4px}
.tabs{display:flex}
.tab{flex:1;padding:10px 0 9px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--brand)}
:root[data-theme="dark"] .tab.on{border-bottom-color:var(--sun)}
.tab small{font-weight:500;margin-left:4px}
main{padding:14px 0 130px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;overflow:hidden;border-radius:6px;background:var(--line)}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .by{position:absolute;left:5px;bottom:5px;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid rgba(255,255,255,.9)}

/* Chat */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;align-self:flex-start}
.msg.me{align-self:flex-end}
.who{font-size:13px;color:var(--muted);margin:0 0 2px 4px}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px}
.msg.me .bub{background:var(--brand);color:var(--on-brand);border-color:transparent;border-radius:16px 16px 4px 16px}
.bub time{display:block;font-size:11px;opacity:.65;margin-top:2px;text-align:right}
.mph{display:block;margin:-2px -6px 6px;border-radius:10px;overflow:hidden}
.mph img{display:block;width:200px;max-width:100%;height:auto}
.comp{display:flex;gap:8px}
.inp{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}

/* Personas */
.invite{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.invbtns{display:flex;gap:8px;flex-wrap:wrap}
.code{font-size:30px;font-weight:800;letter-spacing:.14em;line-height:1.1}
.joincard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px}
.usearch{display:flex;flex-direction:column;gap:4px;margin:-6px 0 10px}
.usres{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.getapp{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:99;text-align:center;background:var(--accent);color:#fff;font-weight:800;padding:12px 14px;border-radius:14px;text-decoration:none}
.qrframe{position:relative;display:flex;justify-content:center;margin:16px 0;padding:14px;border-radius:24px;background:linear-gradient(160deg,#1a1441,#241a55);box-shadow:0 0 30px 6px rgba(214,51,108,.45),0 0 55px 14px rgba(107,92,231,.3)}
.qrwrap{display:flex;justify-content:center;align-items:center;padding:14px;background:#fff;border-radius:16px}
.qrwrap svg{width:220px;height:220px;display:block}
.qr-mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#2B2A6B,#171233);display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 4px 10px rgba(0,0,0,.35);color:#fff}
.people{list-style:none;margin:0 0 14px;padding:0}
.people li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.people li span:nth-child(2){flex:1;font-weight:500}

/* Visor de foto */
#lb{display:none}
#lb.on{display:flex;flex-direction:column;position:fixed;inset:0;z-index:50;background:rgba(10,8,28,.97);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.lbtop{display:flex;align-items:center;gap:8px;padding:8px 10px}
.lbwho{display:flex;align-items:center;gap:8px;font-weight:700}
.dim{opacity:.65;font-weight:400;font-size:14px}
.lbimg{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lbimg img{max-width:100%;max-height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.nav.l{left:8px}.nav.r{right:8px}
.nav[disabled]{opacity:.2}
.lbact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.btn.light{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.btn.light.danger{color:#FFB3C6}
.hint{text-align:center;margin:0 0 calc(10px + env(safe-area-inset-bottom,0px))}
.ib.light{color:#fff}

/* Hoja inferior */
#sheet{display:none}
#sheet.on{display:block}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,8,28,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(10,8,28,.25);display:grid;gap:12px}
.sheet h2{margin:0;font-size:24px;letter-spacing:-.02em}
.sheet p{margin:0}
.sheet label{font-weight:700;font-size:14px;display:grid;gap:4px}
.sheet .inp{background:var(--bg)}
.icon-pick{position:relative}
.icon-pick-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;color:var(--ink)}
.icon-pick-btn svg{margin-left:auto;opacity:.6}
.icon-pick-emoji{font-size:24px;line-height:1}
.ems{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;max-height:220px;overflow-y:auto;padding:2px}
.ems[hidden]{display:none}
.em{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:8px 10px;border-radius:14px;background:var(--bg);border:2px solid transparent}
.em .em-ico{font-size:22px;line-height:1}
.em .em-lbl{font-size:11px;font-weight:600;color:var(--muted)}
.em.on{border-color:var(--accent)}
.em.on .em-lbl{color:var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
/* Historias */
.promo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:14px;padding:14px;margin-bottom:14px;background:linear-gradient(135deg,#D6336C,#7B4FD1);color:#fff}
.promo strong{display:block;font-size:17px;line-height:1.2}
.promo .ps{display:block;font-size:14px;opacity:.92;margin-top:2px}
.promo .pi{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);flex:none}
#story{display:none}
#story.on{display:flex;flex-direction:column;position:fixed;inset:0;z-index:55;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sthead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.sthead h2{margin:0;font-size:20px;letter-spacing:-.02em}
.stbody{flex:1;overflow:auto;padding:14px 16px 24px;max-width:560px;width:100%;margin:0 auto}
.stbody h3{margin:22px 0 8px;font-size:16px}
.stbody p{margin:0 0 10px}
.stbar{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.stbar .btn{max-width:528px;margin:0 auto}
.cell.sel{outline:3px solid var(--accent);outline-offset:-3px}
.cell .tick{display:none;position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;place-items:center}
.cell.sel .tick{display:grid}
.mus{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cb{min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.cb.on{border-color:var(--accent)}
.stmake{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;min-height:0}
.stmake canvas{max-height:60vh;max-width:100%;width:auto;height:auto;border-radius:14px;box-shadow:0 10px 30px rgba(10,8,28,.3);background:#000}
.stmake p{margin:0;text-align:center}
.prog{width:min(320px,80vw);height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.stdone{display:grid;gap:10px;align-content:start}
.stdone video{max-height:58vh;max-width:100%;border-radius:14px;display:block;margin:0 auto;background:#000}

/* Portada */
#cover{display:none}
/* pantalla completa real en iPhone (app instalada): 100vh cubre también la zona del indicador de inicio */
#cover.on,#lb.on,#story.on,#ed.on{height:100vh;height:100dvh;min-height:-webkit-fill-available}
#cover.on{display:block;position:fixed;inset:0;z-index:70;overflow-y:auto;overflow-x:hidden;color:#fff;transition:opacity .35s;
  background:radial-gradient(120% 55% at 50% 0%,#4a1f9c 0%,transparent 62%),radial-gradient(70% 40% at 95% 58%,rgba(140,60,220,.35) 0%,transparent 70%),linear-gradient(180deg,#1b0a45 0%,#160838 45%,#0d0524 100%)}
#cover.out{opacity:0}
.cv{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.cv > *{position:relative;z-index:1}
.cv .cv-fx,.cv .cv-note{position:absolute}
.cv .cv-art{position:absolute;z-index:0}
.cv-fx{inset:0;pointer-events:none;z-index:0}
.cv-fx i{position:absolute;display:block;border-radius:1px}
.cv-fx .sp{position:absolute}
.cv-art{left:0;right:0;bottom:0;height:min(44%,340px);pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34%);mask-image:linear-gradient(to bottom,transparent 0,#000 34%)}
.cv-art svg{display:block;width:100%;height:100%}
.cv-note{z-index:2}
.cv-note.l{left:8px;top:calc(env(safe-area-inset-top,0px) + 48px);width:130px;transform:rotate(-12deg);font-size:12px;line-height:1.25;color:rgba(255,255,255,.8)}
.cv-note.l svg{position:absolute;left:0;top:-14px;z-index:-1}
.cv-note.l span{display:block;padding:14px 0 0 16px}
.cv-note.r{right:10px;top:calc(env(safe-area-inset-top,0px) + 50px);font-family:"Caveat","Bricolage Grotesque",cursive;font-size:20px;line-height:1.05;transform:rotate(8deg);color:rgba(255,255,255,.92)}
.cv-logo{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:6px}
.cv-logo-svg{filter:drop-shadow(0 0 14px rgba(190,110,255,.55))}
.cv-word{margin:2px 0 0;font-size:clamp(38px,11.5vw,50px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.cv-tag{margin:6px 0 0;font-size:9.5px;letter-spacing:.16em;color:rgba(255,255,255,.7)}
.grad{background:linear-gradient(90deg,#ff6fe0,#b57bff 60%,#7b93ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cv-head{margin:26px 0 0;text-align:center;font-size:clamp(38px,11.5vw,52px);line-height:1.02;font-weight:800;letter-spacing:-.03em}
.cv-under{display:block;margin:2px auto 0}
.cv-sub{margin:12px 0 0;max-width:28ch;text-align:center;color:rgba(255,255,255,.72);font-size:15px;line-height:1.4}
.cv-tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:440px;margin-top:22px}
.cv-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;aspect-ratio:1/1.1;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff}
.cv-tile.pk svg{color:#ff7be0}
.cv-tile.cy svg{color:#5be0ff}
.cv-tile span{font-size:9px;letter-spacing:-.01em;white-space:nowrap;color:rgba(255,255,255,.85)}
.cv-cta{margin-top:auto;padding-top:150px;width:calc(100% + 28px);margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cv-cta > *{width:100%;max-width:440px}
.cv-go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:99px;font-size:19px;font-weight:700;color:#fff;background:linear-gradient(90deg,#ff5fd0,#9b6bff 55%,#5b8cff);box-shadow:0 8px 26px rgba(150,90,255,.45);position:relative}
.cv-go svg{position:absolute;right:20px}
.cv-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cv-ghost{min-height:46px;border-radius:99px;border:1px solid rgba(255,255,255,.28);background:rgba(20,8,52,.55);color:#fff;font-weight:500;font-size:15px}
.cv-foot{display:flex;align-items:center;gap:10px;margin:4px 0 0;font-size:9.5px;letter-spacing:.16em;color:rgba(255,255,255,.55);white-space:nowrap}
.cv-foot span{flex:1;height:1px;background:rgba(255,255,255,.25)}
#cover :focus-visible{outline-color:#ffd166}

/* Tutorial de bienvenida (una sola vez por dispositivo) */
#tour{display:none}
#tour.on{display:block;position:fixed;inset:0;z-index:71;overflow:hidden;color:#fff;transition:opacity .3s;
  height:100vh;height:100dvh;min-height:-webkit-fill-available;
  background:radial-gradient(90% 45% at 12% 8%,rgba(255,95,208,.55) 0%,transparent 65%),radial-gradient(80% 45% at 92% 22%,rgba(91,140,255,.5) 0%,transparent 65%),radial-gradient(90% 40% at 50% 100%,rgba(255,160,64,.38) 0%,transparent 70%),linear-gradient(180deg,#3a1290 0%,#230b5e 50%,#14063a 100%)}
#tour.out{opacity:0}
.tr{position:relative;min-height:100%;display:flex;flex-direction:column;max-width:440px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(env(safe-area-inset-bottom,0px) + 20px)}
.tr-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.tr-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tr-fx i{position:absolute;top:-6%;width:9px;height:14px;border-radius:2px;opacity:.9;animation:trfall linear infinite}
.tr-fx b{position:absolute;color:#ffd166;font-size:18px;animation:trtw 2.2s ease-in-out infinite}
@keyframes trfall{to{transform:translateY(112vh) rotate(540deg)}}
@keyframes trtw{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1.2);opacity:1}}
@keyframes trpop{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes trbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.tr-body{position:relative;z-index:1}
.tr-emoji{position:relative;font-size:72px;line-height:1;width:150px;height:150px;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(255,255,255,.08) 60%,transparent 72%);
  box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 46px 8px rgba(255,95,208,.45),0 0 90px 22px rgba(91,140,255,.3);
  animation:trpop .6s cubic-bezier(.2,.9,.3,1.2) both,trbob 3s ease-in-out .6s infinite}
.tr-emoji:has(img){width:auto;height:auto;background:none;box-shadow:none;border-radius:0}
.tr-emoji img{max-height:170px;max-width:190px;object-fit:contain}
.tr-mark{position:static;display:grid;width:100px;height:100px;border-radius:26px;margin:0 auto;box-shadow:0 0 0 5px #fff,0 0 40px 10px rgba(214,51,108,.5),0 0 70px 18px rgba(107,92,231,.35)}
.tr-mark svg{width:46px;height:46px}
.tr-title{margin:0;font-size:28px;font-weight:800;letter-spacing:-.015em;background:linear-gradient(90deg,#fff,#ffd6f5 55%,#c9d8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tr-text{margin:0;font-size:16px;line-height:1.5;color:rgba(255,255,255,.9);max-width:30ch}
.tr-dots{display:flex;gap:7px;justify-content:center;margin:18px 0 4px}
.tr-dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.3);border:0;padding:0;transition:width .2s,background .2s}
.tr-dot.on{background:linear-gradient(90deg,#ff5fd0,#ffd166);width:22px}
.tr-cta{min-height:54px;border-radius:99px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(90deg,#ff5fd0,#9b6bff 55%,#5b8cff);box-shadow:0 8px 26px rgba(150,90,255,.4);width:100%;margin-top:12px}
#tour :focus-visible{outline-color:#ffd166}
#lvlup{display:none}
#lvlup.on{display:grid;place-items:center;position:fixed;inset:0;z-index:90;background:radial-gradient(70% 50% at 50% 40%,rgba(255,95,208,.35),transparent 70%),rgba(12,5,36,.92);animation:lvfade .3s both}
#lvl-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lv-box{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 28px;max-width:420px;width:100%;color:#fff}
.lv-k{font-size:15px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#ffd166}
.lv-img{max-height:300px;max-width:78%;object-fit:contain;filter:drop-shadow(0 0 30px rgba(255,95,208,.7));animation:lvpop .8s cubic-bezier(.2,.9,.3,1.3) both}
.lv-n{font-size:34px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#ffd6f5 55%,#c9d8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lv-d{font-size:16px;color:rgba(255,255,255,.85);margin-bottom:10px}
@keyframes lvpop{0%{transform:scale(.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes lvfade{from{opacity:0}to{opacity:1}}

/* Plan del evento */
.sheet{max-height:92vh;overflow-y:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:13px}
.chip.up{background:var(--accent);color:#fff;border-color:transparent}
.rems{display:grid;gap:8px;margin:0 0 16px}
.rem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px}
.rem strong{display:block}
.rem > span:last-child{display:block;color:var(--muted);font-size:14px}
.rem .bell{color:var(--accent);display:grid;place-items:center}
.pl-hero{border-radius:16px;padding:18px;color:#fff;margin-bottom:6px}
.pl-hero .k{font-size:15px;opacity:.92}
.pl-hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.pl-hero ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.pl-hero li{display:flex;gap:8px;align-items:center;font-weight:500}
.pl-hero .notes{margin:12px 0 0;opacity:.95}
.pl-h{margin:22px 0 6px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.pl-h + .muted{margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.va{background:#1F9E89;color:#fff}
.pill.tm{background:var(--sun);color:#1E1B3A}
.pill.no{background:var(--line);color:var(--muted)}
.pill.pend{border:1px solid var(--line);color:var(--muted)}
.people li .nm small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.inv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inv3 .btn{padding:0 8px;font-size:15px}
.rmlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rmlist li{background:var(--bg);border-radius:12px;padding:10px 12px}
.rmlist strong{display:block;font-size:14px;color:var(--muted)}

/* Menú de inicio */
.hero{padding-bottom:14px;align-items:center}
.hm{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 0 18px}
.hm-t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;aspect-ratio:1/1.1;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.hm-t span{font-size:clamp(8px,2.35vw,10px);letter-spacing:-.02em;white-space:nowrap;color:var(--muted);font-weight:500}
.hm-t.on{border-color:var(--accent)}
.hm-t.on span{color:var(--ink);font-weight:700}
.hm-t.pk svg{color:var(--accent)}
.hm-t.cy svg{color:#1F9E89}
/* Invitaciones */
.gform{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:6px}
.gform label{font-weight:700;font-size:14px;display:grid;gap:4px}
.gform .inp{background:var(--bg)}
.gform .link{justify-self:start}
.people li.lnk{padding:0}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 2px}
.rowbtn .nm{flex:1;font-weight:500}
.rowbtn .nm small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.hm-t{position:relative}
.hm-t .bd{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
/* Música */
.lbl{font-weight:700;font-size:14px;margin-bottom:4px}
.gform select.inp{appearance:auto;-webkit-appearance:menulist}
.sg-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.song{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.sg-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.sg-top > span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);white-space:nowrap}
.pf::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc,#999)}
.sg-t{font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.2;margin-top:2px}
.sg-a{color:var(--muted)}
.sg-n{margin:4px 0 0;padding-left:10px;border-left:3px solid var(--accent)}
.sg-b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.sg-b .by2{flex:1;min-width:80px;font-size:14px;color:var(--muted)}
.heart[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.heart[aria-pressed="true"] svg{fill:currentColor}
/* Lugares */
.nextev{background:var(--surface);border:1px solid var(--line);border-left:4px solid #1F9E89;border-radius:12px;padding:12px 14px;margin:0 0 14px;display:grid;gap:2px}
.nextev .t{font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.25}
.nextev .link{justify-self:start;padding-bottom:0}
.coord{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:17px}
.mapbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
details.loc{margin:4px 0 6px}
details.loc summary{cursor:pointer;font-weight:700;color:var(--accent);padding:8px 0}
.plano{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.cell .gp{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;background:#1F9E89;color:#fff;display:grid;place-items:center;border:2px solid rgba(255,255,255,.9)}
.ploc{display:flex;align-items:center;gap:12px}
.ploc img{width:64px;height:64px;object-fit:cover;border-radius:10px}
/* Fotos */
.rowbtns{display:flex;gap:8px}
.album{display:grid;gap:8px}
.abar{display:flex;gap:8px}
.fsbar{display:flex;gap:8px}
.fsbar .btn{flex:1;padding:0 8px;font-size:15px}
/* Perfil */
.pfbtn{border-radius:50%;padding:0;display:grid;place-items:center}
.pf-head{display:flex;align-items:center;gap:20px;padding:6px 0 12px}
.pf-stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.pf-stats b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.pf-stats span{font-size:13px;color:var(--muted)}
.pf-name{font-weight:800;font-size:18px}
.pf-priv{margin:6px 0 12px}
.evi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.acct-photo{display:flex;align-items:center;gap:14px}
.acct-btns{display:grid;gap:2px;justify-items:start}
/* Cuenta fácil, seguidores y me gusta */
.prov{display:grid;gap:8px}
.prov button{min-height:48px;border-radius:12px;font-weight:700;font-size:16px}
.prov .apl{background:#000;color:#fff;border:1px solid var(--line)}
.prov .ggl{background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.notice{background:var(--bg);border-left:4px solid var(--sun);border-radius:10px;padding:10px 12px;font-size:14px}
.pf-stats .stat{text-align:center;padding:0;color:inherit}
.pf-stats button.stat:active{opacity:.6}
.pf-tag{margin-top:2px}
.pf-badge{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--surface),var(--bg));border:1px solid var(--line);color:var(--ink);font-weight:800;font-size:17px;padding:10px 14px;border-radius:16px;margin:8px 0 12px}
.pf-badge-ic{width:72px;height:88px;display:grid;place-items:center;flex:none}
.pf-badge-ic img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(150,90,255,.45))}
.pf-badge-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pf-badge em{font-style:normal;font-weight:600;font-size:13px;color:var(--muted)}
.pf-badge small{font-weight:700;font-size:12px;color:var(--sun)}
.pf-badge.off{border-style:dashed;color:var(--muted)}
.pf-badge.off .pf-badge-ic img{filter:grayscale(1) brightness(.7);opacity:.45}
.people li .rowbtn{flex:1;width:auto}
.heartb[aria-pressed="true"]{color:#ff8ab0}
.heartb[aria-pressed="true"] svg{fill:currentColor}
.lkline{text-align:center;margin:0 12px 4px}
.cell .lk{position:absolute;left:5px;bottom:5px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:99px;padding:1px 8px}
.lbwho{color:#fff;background:none;padding:4px 6px;border-radius:10px}
/* Iniciar sesión */
.blur{filter:blur(16px);pointer-events:none;user-select:none}
.lg-who{display:flex;align-items:center;gap:12px}
.lg-who h2{margin:0}
.sec li .nm{flex:1;font-weight:500}
.btn.danger{color:var(--danger);border-color:var(--danger)}
/* Editor de fotos y stickers */
#ed{display:none}
#ed.on{display:flex;flex-direction:column;position:fixed;inset:0;z-index:45;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.edtop{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.edtop h2{margin:0;font-size:19px;letter-spacing:-.01em;flex:1}
.edbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto}
.edcv{display:grid;place-items:center}
#ed-cv{border-radius:10px;background:#111;box-shadow:0 6px 20px rgba(10,8,28,.25);touch-action:none}
.edtools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.edtools .btn{min-height:42px;min-width:42px;padding:0 12px;font-size:15px}
.edtools .btn[disabled]{opacity:.35}
.trayh{border-bottom:1px solid var(--line)}
.tray{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,86px);grid-auto-columns:116px;gap:8px;overflow-x:auto;padding-bottom:6px}
.stk{position:relative;display:grid;place-items:center;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.stk img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.stk .lock{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:rgba(30,27,58,.85);color:#fff;display:grid;place-items:center}
.unlock{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px}
.unlock strong{display:block}
.unlock span{color:var(--muted);font-size:14px}
#pay{display:none}
#pay.on{display:block}
.payscrim{position:fixed;inset:0;z-index:60;background:rgba(10,8,28,.55)}
.paysheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:92vh;overflow-y:auto;box-shadow:0 -12px 40px rgba(10,8,28,.25)}
.paysheet h2{margin:0;font-size:24px;letter-spacing:-.02em}
.paysheet p{margin:0}
.paystrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--bg);border-radius:14px;padding:10px}
.paystrip img{width:100%;height:64px;object-fit:contain}
.paylist{margin:0;padding-left:20px;display:grid;gap:4px}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:12px 14px}
.payrow span small{display:block;color:var(--muted);font-size:13px}
.payrow b{font-size:20px}
/* Chat */
.cmeta{display:grid;justify-items:end;gap:4px;font-size:12px;color:var(--muted);flex:none}
.ub{background:var(--accent);color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.rowbtn .nm{min-width:0}
.rowbtn .nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickgrid{max-height:40vh;overflow:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="lb"></div>
<div id="story"></div>
<div id="ed"></div>
<div id="pay"></div>
<div id="cover"></div>
<div id="tour"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="pfile" accept="image/*" hidden>
<input type="file" id="cfile" accept="image/*" hidden>
<input type="file" id="qrfile" accept="image/*" capture="environment" hidden>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); };
var uid = function(){ return Math.random().toString(36).slice(2, 10); };
var CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var mkCode = function(){ var s = ''; for (var i = 0; i < 6; i++) s += CODE_CH[Math.floor(Math.random() * CODE_CH.length)]; return s; };
var todayISO = function(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
var PAL = ['#D6336C', '#1F9E89', '#7B4FD1', '#D9760B', '#2B7DE1', '#B4235F'];
var GR = [['#D6336C', '#F6B93B'], ['#1F9E89', '#2B2A6B'], ['#F6B93B', '#1F9E89'], ['#7B4FD1', '#D6336C'], ['#2B7DE1', '#1F9E89']];
/* íconos del evento: emoji + nombre, para el selector desplegable de "Nuevo evento" */
var ICONS = [
  {e: '🎉', l: 'Fiesta', k: 'fiesta'}, {e: '🎂', l: 'Cumpleaños', k: 'cumpleanos'}, {e: '✈️', l: 'Viaje', k: 'viaje'},
  {e: '🏖️', l: 'Playa', k: 'playa'}, {e: '🍖', l: 'Asado / BBQ', k: 'asado'}, {e: '🍽️', l: 'Cena', k: 'cena'},
  {e: '🍻', l: 'Salida con amigos', k: 'salida'}, {e: '🎵', l: 'Concierto', k: 'concierto'}, {e: '💃', l: 'Discoteca / Club', k: 'discoteca'},
  {e: '🏡', l: 'Reunión en casa', k: 'casa'}, {e: '⚽', l: 'Deportes', k: 'deportes'}, {e: '🎓', l: 'Graduación', k: 'graduacion'},
  {e: '💍', l: 'Boda / compromiso', k: 'boda'}, {e: '🎄', l: 'Navidad', k: 'navidad'}, {e: '🎆', l: 'Año Nuevo', k: 'anonuevo'},
  {e: '☕', l: 'Reunión / café', k: 'cafe'}, {e: '🎮', l: 'Gaming', k: 'gaming'}, {e: '🎬', l: 'Cine', k: 'cine'},
  {e: '🥳', l: 'Otro', k: 'otro'}
];
/* portada de cada tipo de evento: covers/<clave>.jpg; si el archivo aún no existe, se usa el degradado con el ícono */
var coverState = {};
function coverFor(emoji){
  var k = null; ICONS.forEach(function(ic){ if (ic.e === emoji) k = ic.k; });
  if (!k) return null;
  if (coverState[k] === true) return 'covers/' + k + '.jpg';
  if (coverState[k] === undefined) {
    coverState[k] = 'wait';
    var im = new Image();
    im.onload = function(){ coverState[k] = true; if (ui.view === 'home') render(); };
    im.onerror = function(){ coverState[k] = false; };
    im.src = 'covers/' + k + '.jpg';
  }
  return null;

function idb(){
  return new Promise(function(res, rej){
    try {
      var r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    } catch (e) { rej(e); }
  });
}
function load(){
  return idb().then(function(db){
    return new Promise(function(res, rej){
      var q = db.transaction('kv').objectStore('kv').get(KEY);
      q.onsuccess = function(){ res(q.result || null); };
      q.onerror = function(){ rej(q.error); };
    });
  }).catch(function(){ return null; });
}
var saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    idb().then(function(db){ db.transaction('kv', 'readwrite').objectStore('kv').put(S, KEY); }).catch(function(){});
  }, 300);
}

function readImage(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ rej(); };
      img.onload = function(){
        var max = 1280, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.82));
      };

function act(a, t){
  if (a.slice(-4) !== '-del') ui.armed = null;

  var ev, list, i;
  switch (a) {
    case 'note-ok': S.noteSeen = true; save(); render(); break;

      var ic = iconInfo(t.dataset.e);

      if (eSpan) eSpan.textContent = ic.e;
      if (lSpan) lSpan.textContent = ic.l;

      if (btn) btn.setAttribute('aria-expanded', 'false');

      if (grid2) { grid2.hidden = !grid2.hidden; if (btn2) btn2.setAttribute('aria-expanded', grid2.hidden ? 'false' : 'true'); }

      var nm = ($('#f-me').value || '').trim();

      S.me = nm;
      ensureDemos();
      save(); ui.sheet = null; renderSheet(); render(false);
      break;
    case 'create-event':
      var name = ($('#f-name').value || '').trim();
      if (!name) { toast('Ponle un nombre al evento'); $('#f-name').focus(); return; }
      var data = {name: name, place: ($('#f-place').value || '').trim(), date: $('#f-date').value, time: $('#f-time').value, notes: ($('#f-notes').value || '').trim(), emoji: ui.form.emoji || '🎂'};
      if (ui.editId) {
        ev = S.events.filter(function(e){ return e.id === ui.editId; })[0];
        if (ev) Object.assign(ev, data);
        ui.editId = null; ui.sheet = null; renderSheet(); save(); render(); toast('Cambios guardados');
        break;
      }
      ev = newEvent(data); ev.toSync = true;
      S.events.push(ev); save();
      SB.syncEvent(ev);
      ui.sheet = null; renderSheet();
      ui.view = 'event'; ui.eid = ev.id; ui.tab = 'plan';
      render(false); window.scrollTo(0, 0);
      break;
    case 'open': ui.from = null; ui.view = 'event'; ui.eid = t.dataset.id; ui.tab = defTab(S.events.filter(function(e){ return e.id === t.dataset.id; })[0]); render(false); window.scrollTo(0, 0); break;
    case 'back': ui.view = ui.from || 'home'; ui.from = null; ui.eid = null; render(false); window.scrollTo(0, 0); break;
    case 'tab':
      ui.tab = t.dataset.tab; if (ui.tab === 'chat') ui.stick = true;
      render(false); if (ui.tab !== 'chat') window.scrollTo(0, 0);
      break;
    case 'upload': $('#file').click(); break;
    case 'photo': ui.lb = t.dataset.id; renderLb(); break;
    case 'lb-close': ui.lb = null; renderLb(); break;
    case 'lb-prev': case 'lb-next':
      list = sorted(cur()); i = -1; list.forEach(function(p, k){ if (p.id === ui.lb) i = k; });
      i += a === 'lb-prev' ? -1 : 1;
      if (list[i]) { ui.lb = list[i].id; renderLb(); }
      break;
    case 'lb-dl':
      ev = cur(); list = ev.photos.filter(function(p){ return p.id === ui.lb; });
      if (list[0]) downloadOne(ev, list[0]);
      break;
    case 'lb-share':
      ev = cur(); ev.chat.push({id: uid(), by: S.me, at: Date.now(), text: '', photoId: ui.lb});
      save(); render(); toast('Foto compartida en el chat');
      break;

      ev = cur(); list = sorted(ev); i = -1; list.forEach(function(p, k){ if (p.id === ui.lb) i = k; });
      var gone = ui.lb;
      ev.photos = ev.photos.filter(function(p){ return p.id !== gone; });
      ui.armed = null;
      ui.lb = (list[i + 1] || list[i - 1] || {}).id || null;
      save(); renderLb(); render(); toast('Foto eliminada');
      break;
    case 'lb-send':
      ev = cur(); list = ev.photos.filter(function(p){ return p.id === ui.lb; });
      if (list[0]) shareFiles(ev, [list[0]]);
      break;
    case 'dl-all': downloadAll(cur()); break;
    case 'send':
      var txt = (ui.draft || '').trim(); if (!txt) return;
      ev = cur(); ev.chat.push({id: uid(), by: S.me, at: Date.now(), text: txt});
      if (ev.serverId) SB.syncMessage({text: txt, eventId: ev.serverId});
      ui.draft = ''; ui.stick = true; save(); render(false);
      var ci = $('#chatin'); if (ci) ci.focus();
      break;
    case 'copy-invite':
      ev = cur();
      var msg = inviteText(ev);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).then(function(){ toast('Invitación copiada'); }, function(){ toast('Código: ' + groupCode()); });
      } else toast('Código: ' + groupCode());
      break;
    case 'sim':
      ev = cur();
      var pool = ['Ana', 'Luis', 'Marta', 'José'].filter(function(n){ return n !== S.me; });
      var who = pool[Math.floor(Math.random() * pool.length)];
      if (ev.members.indexOf(who) < 0) ev.members.push(who);
      var em = [ev.emoji].concat(PARTY);
      for (var k = 0; k < 2; k++) ev.photos.push({id: uid(), by: who, at: Date.now() + k, data: makePhoto(em[Math.floor(Math.random() * em.length)], k)});
      ev.chat.push({id: uid(), by: who, at: Date.now(), text: '¡Ya subí mis fotos!'});
      save(); render(); toast(who + ' subió 2 fotos');
      break;
    case 'ev-del':
      ev = cur();
      if (ui.armed !== 'e' + ev.id) { ui.armed = 'e' + ev.id; render(); return; }
      S.events = S.events.filter(function(e){ return e.id !== ev.id; });
      ui.armed = null; ui.view = 'home'; ui.eid = null; save(); render(false); window.scrollTo(0, 0); toast('Evento eliminado');
      break;
  }
}

var PROMO = '<button class="promo" data-act="story"><span class="pi">' + svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/>', 26) + '</span><span><strong>Crea una historia con música</strong><span class="ps">Un video con las fotos del evento, listo para publicar.</span></span></button>';

/* música generada en el dispositivo (sin canciones con derechos de autor) */
function noiseBuf(ctx){
  var b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function tone(ctx, out, f, t, d, type, vol, atk, cut){
  var o = ctx.createOscillator(), g = ctx.createGain(), fl = ctx.createBiquadFilter();
  o.type = type; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = cut || 4000;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + Math.min(atk || 0.01, d * 0.6));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(fl); fl.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05);
}
function kick(ctx, out, t){
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.25);
}
function hat(ctx, out, t, nb, vol, freq, len){
  var s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  s.buffer = nb; f.type = 'highpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + len + 0.02);
}
function scheduleTrack(ctx, out, kind, dur, t0){
  var m = ctx.createGain(), cp = ctx.createDynamicsCompressor();
  m.gain.setValueAtTime(0.0001, t0); m.gain.linearRampToValueAtTime(0.85, t0 + 0.8);
  m.gain.setValueAtTime(0.85, Math.max(t0 + 1, t0 + dur - 2)); m.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  m.connect(cp); cp.connect(out);
  var nb = noiseBuf(ctx), t, k, j, at;
  if (kind === 'fiesta') {
    var b = 60 / 118, prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], bass = [45, 41, 36, 43], arp = [0, 1, 2, 1];
    for (k = 0, t = 0; t < dur; k++, t += b / 2) {
      at = t0 + t;
      var bar = Math.floor(k / 8) % 4, e = k % 8;
      if (k % 2 === 0) kick(ctx, m, at);
      if (e === 2 || e === 6) hat(ctx, m, at, nb, 0.5, 1800, 0.14);
      else if (k % 2 === 1) hat(ctx, m, at, nb, 0.22, 7000, 0.05);
      tone(ctx, m, midi(bass[bar] + (k % 2 ? 12 : 0)), at, b * 0.45, 'sawtooth', 0.16, 0.005, 650);
      if (e === 2 || e === 6) prog[bar].forEach(function(n){ tone(ctx, m, midi(n + 12), at, b * 0.8, 'square', 0.045, 0.01, 2000); });
      tone(ctx, m, midi(prog[bar][arp[k % 4]] + 24), at, b * 0.5, 'triangle', 0.1, 0.01, 3200);
    }
  } else if (kind === 'suave') {
    var b2 = 60 / 76, pr = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], pat = [0, 1, 2, 1, 2, 1, 0, 1];
    for (k = 0, t = 0; t < dur; k++, t += b2 * 4) {
      at = t0 + t;
      var ch = pr[k % 4];
      ch.forEach(function(n){ tone(ctx, m, midi(n), at, b2 * 4.2, 'triangle', 0.09, 0.7, 1400); });
      tone(ctx, m, midi(ch[0] - 12), at, b2 * 3.5, 'sine', 0.16, 0.05, 400);
      for (j = 0; j < 8; j++) tone(ctx, m, midi(ch[pat[j]] + 12), at + j * b2 / 2, b2 * 1.2, 'sine', 0.11, 0.01, 2600);
      for (j = 0; j < 4; j++) hat(ctx, m, at + j * b2, nb, 0.12, 9000, 0.04);
    }
  } else if (kind === 'romantico') {
    var b3 = 60 / 66, pr3 = [[53, 57, 60], [48, 52, 55], [50, 53, 57], [46, 50, 53]], pat3 = [0, 1, 2, 1, 0, 2, 1, 2];
    for (k = 0, t = 0; t < dur; k++, t += b3 * 4) {
      at = t0 + t;
      var ch3 = pr3[k % 4];
      ch3.forEach(function(n){ tone(ctx, m, midi(n), at, b3 * 4.3, 'sine', 0.11, 0.9, 1200); });
      tone(ctx, m, midi(ch3[0] - 12), at, b3 * 4, 'sine', 0.2, 0.08, 300);
      for (j = 0; j < 8; j++) tone(ctx, m, midi(ch3[pat3[j]] + 24), at + j * b3 / 2, b3 * 2.2, 'triangle', 0.08, 0.006, 2400);
    }
  }
}

/* dibujo del video (vertical 9:16) */
function bg(x, i, u, alpha){
  var pr = GR[((i % GR.length) + GR.length) % GR.length];
  var g = x.createLinearGradient(0, 0, VW, VH); g.addColorStop(0, pr[0]); g.addColorStop(1, pr[1]);
  x.globalAlpha = alpha; x.fillStyle = g; x.fillRect(0, 0, VW, VH);
  for (var k = 0; k < 12; k++) {
    var s = i * 17 + k * 5, cx = rnd(s) * VW, cy = (((rnd(s + 1) * VH - u * 90 * (1 + k % 3)) % VH) + VH) % VH, rr = 24 + rnd(s + 2) * 70;
    x.beginPath(); x.fillStyle = 'rgba(255,255,255,' + (0.06 + rnd(s + 3) * 0.12) + ')'; x.arc(cx, cy, rr, 0, 7); x.fill();
  }
}
function fitText(x, txt, cx, y, maxW, size, weight, color){
  x.fillStyle = color || '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  do { x.font = weight + ' ' + size + 'px "Bricolage Grotesque",system-ui,sans-serif'; size -= 2; } while (x.measureText(txt).width > maxW && size > 22);
  x.fillText(txt, cx, y);
}
function drawIntro(x, ev, u, alpha){
  bg(x, ev.grad, u, alpha);
  x.globalAlpha = alpha;
  var s = 0.8 + 0.2 * ease(u * 2.2);
  x.save(); x.translate(VW / 2, VH * 0.38); x.scale(s, s);
  x.font = '230px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = 'rgba(0,0,0,.3)'; x.shadowBlur = 30; x.fillText(ev.emoji, 0, 0);
  x.restore();
  fitText(x, ev.name, VW / 2, VH * 0.56, VW - 120, 84, 800, '#fff');
  if (ev.place) fitText(x, ev.place, VW / 2, VH * 0.63, VW - 140, 42, 500, 'rgba(255,255,255,.92)');
  if (ev.date) fitText(x, fmtDate(ev.date), VW / 2, VH * 0.68, VW - 140, 38, 500, 'rgba(255,255,255,.85)');
  fitText(x, 'Friends Party', VW / 2, VH - 70, VW - 200, 32, 700, 'rgba(255,255,255,.9)');
  x.globalAlpha = 1;
}
function drawPhoto(x, im, p, i, u, alpha, ev){
  bg(x, i, u, alpha);
  x.globalAlpha = alpha;
  var sc = Math.min(600 / im.width, 880 / im.height), pw = im.width * sc, ph = im.height * sc;
  var fw = pw + 44, fh = ph + 22 + 92;
  var slide = Math.pow(1 - Math.min(1, u * SC.photo / 0.8), 2) * 70;
  var ang = (i % 2 ? 1 : -1) * 0.035, z = 1 + 0.05 * u;
  x.save(); x.translate(VW / 2, VH / 2 + 10 + slide); x.rotate(ang); x.scale(z, z);
  x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 40; x.shadowOffsetY = 14;
  x.fillStyle = '#fff'; x.fillRect(-fw / 2, -fh / 2, fw, fh);
  x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetY = 0;
  x.drawImage(im, -fw / 2 + 22, -fh / 2 + 22, pw, ph);
  x.fillStyle = '#2B2A6B'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '700 34px "Bricolage Grotesque",system-ui,sans-serif';
  x.fillText('de ' + p.by, 0, fh / 2 - 46);
  x.restore();
  x.globalAlpha = alpha;
  fitText(x, ev.emoji + ' ' + ev.name, VW / 2, 110, VW - 100, 46, 800, '#fff');
  fitText(x, 'Friends Party', VW / 2, VH - 70, VW - 200, 32, 700, 'rgba(255,255,255,.9)');
  x.globalAlpha = 1;
}
function drawOutro(x, ev, n, u, alpha){
  bg(x, ev.grad + 2, u, alpha);
  x.globalAlpha = alpha;
  fitText(x, 'Friends Party', VW / 2, VH * 0.42, VW - 100, 100, 800, '#fff');
  fitText(x, ev.name, VW / 2, VH * 0.52, VW - 120, 48, 500, 'rgba(255,255,255,.92)');
  fitText(x, n + (n === 1 ? ' foto' : ' fotos') + ' de ' + ev.members.length + (ev.members.length === 1 ? ' persona' : ' amigos'), VW / 2, VH * 0.58, VW - 140, 38, 500, 'rgba(255,255,255,.85)');
  x.globalAlpha = 1;
}
function drawFrame(x, ims, ps, ev, t){
  var n = ims.length;
  if (t < SC.intro) { drawIntro(x, ev, t / SC.intro, 1); return; }
  var pt = t - SC.intro;
  if (pt < n * SC.photo) {
    var i = Math.floor(pt / SC.photo), local = pt - i * SC.photo;
    if (i === 0) drawIntro(x, ev, 1, 1); else drawPhoto(x, ims[i - 1], ps[i - 1], i - 1, 1, 1, ev);
    drawPhoto(x, ims[i], ps[i], i, local / SC.photo, Math.min(1, local / SC.fade), ev);
    return;
  }
  var ot = pt - n * SC.photo;
  drawPhoto(x, ims[n - 1], ps[n - 1], n - 1, 1, 1, ev);
  drawOutro(x, ev, n, Math.min(1, ot / SC.outro), Math.min(1, ot / SC.fade));
}

/* pantallas y acciones */
function stFoot(){
  var n = ui.story.sel.length, b = $('#st-go'), c = $('#st-count');
  if (c) c.textContent = n + ' de ' + SC.max + ' elegidas';
  if (b) { b.disabled = !n; b.textContent = n ? 'Crear video de ' + Math.round(storyDur(n)) + ' segundos' : 'Elige al menos una foto'; }
}
function caption(ev){
  return ev.emoji + ' ' + ev.name + (ev.place ? ' en ' + ev.place : '') + (ev.date ? ' (' + fmtDate(ev.date) + ')' : '') + '\nLas fotos de todos, juntas en Friends Party.\n#FriendsParty';
}
function renderStory(){
  var el = $('#story'), st = ui.story;
  if (!st) { el.className = ''; el.innerHTML = ''; document.body.style.overflow = ui.lb ? 'hidden' : ''; return; }
  el.className = 'on'; document.body.style.overflow = 'hidden';
  var ev = cur();
  var head = '<div class="sthead"><button class="ib" data-act="st-close" aria-label="Cerrar">' + I.x + '</button><h2>Crear historia</h2></div>';
  if (st.step === 'pick') {
    var list = ev.photos.slice().sort(function(a, b){ return a.at - b.at; });
    el.innerHTML = head + '<div class="stbody"><p class="muted">Elige hasta ' + SC.max + ' fotos. Salen en el orden en que se tomaron.</p>' +
      '<div class="row"><span id="st-count" class="muted"></span><button class="link" data-act="st-none">Quitar todas</button></div>' +
      '<div class="grid">' + list.map(function(p){
        var on = st.sel.indexOf(p.id) >= 0;
        return '<button class="cell' + (on ? ' sel' : '') + '" data-act="st-toggle" data-id="' + p.id + '" aria-pressed="' + on + '" aria-label="Foto de ' + esc(p.by) + '"><img loading="lazy" src="' + p.data + '" alt=""><span class="tick">' + svg('<path d="M5 12l5 5 9-10"/>', 16) + '</span></button>';
      }).join('') + '</div>' +
      '<h3>Música</h3><div class="mus">' + Object.keys(MUSIC).map(function(k){ return '<button class="cb' + (st.music === k ? ' on' : '') + '" data-act="st-music" data-m="' + k + '">' + MUSIC[k] + '</button>'; }).join('') +
      '<button class="link" id="st-prev" data-act="st-prev">Escuchar muestra</button></div></div>' +
      '<div class="stbar"><button class="btn primary block" id="st-go" data-act="st-go"></button></div>';
    stFoot();
  } else if (st.step === 'make') {
    el.innerHTML = head + '<div class="stmake"><canvas id="st-cv" width="' + VW + '" height="' + VH + '"></canvas><div class="prog" id="st-prog"><i></i></div><p class="muted" id="st-time">Preparando…</p><p class="muted note2">Tu historia se crea en tiempo real. Mantén esta pantalla abierta.</p><button class="link" data-act="st-cancel">Cancelar</button></div>';
  } else {
    var r = st.result;
    el.innerHTML = head + '<div class="stbody stdone"><div id="st-vid"><video id="st-video" controls playsinline src="' + r.url + '"></video></div>' +
      '<p class="muted">Tu historia está lista (' + r.mb + ' MB, formato vertical).' + (r.ext === 'webm' ? ' Este dispositivo la crea en formato WebM; Instagram podría pedir convertirla.' : '') + '</p>' +
      (dl ? '<button class="btn primary block" data-act="st-save">' + I.down + ' Guardar video</button>' : '<p class="muted">Guardar no está disponible en esta vista.</p>') +
      (navigator.share ? '<button class="btn block" data-act="st-share">Compartir en redes</button>' : '') +
      '<button class="btn block" data-act="st-copy">Copiar texto para la publicación</button>' +
      '<button class="link" data-act="st-again">Hacer otra historia</button></div>';
    var v = $('#st-video');
    if (v) v.addEventListener('error', function(){ var box = $('#st-vid'); if (box) box.innerHTML = '<p class="muted">La vista previa no se puede mostrar aquí, pero el video está listo para guardar.</p>'; });
  }
}
function openStory(){
  var ev = cur();
  var list = ev.photos.slice().sort(function(a, b){ return a.at - b.at; });
  ui.story = {sel: list.slice(0, SC.max).map(function(p){ return p.id; }), music: 'fiesta', step: 'pick', result: null};
  renderStory();
}
function stopPreview(){
  if (pv) { try { pv.ctx.close(); } catch (e) {} pv = null; var b = $('#st-prev'); if (b) b.textContent = 'Escuchar muestra'; }
}
function togglePreview(){
  if (pv) { stopPreview(); return; }
  var st = ui.story, AC = window.AudioContext || window.webkitAudioContext;
  if (st.music === 'ninguna') { toast('Elegiste crear el video sin música'); return; }
  if (!AC) { toast('Este navegador no puede reproducir la muestra'); return; }
  var ctx = new AC(); ctx.resume();
  scheduleTrack(ctx, ctx.destination, st.music, 8, ctx.currentTime + 0.05);
  pv = {ctx: ctx};
  var b = $('#st-prev'); if (b) b.textContent = 'Detener muestra';
  setTimeout(function(){ if (pv && pv.ctx === ctx) stopPreview(); }, 8300);
}
function cancelRender(){
  if (run) {
    run.cancel = true; clearInterval(run.timer);
    try { if (run.rec && run.rec.state !== 'inactive') run.rec.stop(); } catch (e) {}
    try { if (run.ctx) run.ctx.close(); } catch (e) {}
    run = null;
  }
  if (ui.story && ui.story.step === 'make') { ui.story.step = 'pick'; renderStory(); }
}
function closeStory(){
  cancelRender(); stopPreview();
  if (ui.story && ui.story.result) { try { URL.revokeObjectURL(ui.story.result.url); } catch (e) {} }
  ui.story = null; renderStory();
}
function startRender(){
  var st = ui.story, ev = cur();
  if (!st.sel.length) return;
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) { toast('Este navegador no puede crear videos'); return; }
  stopPreview();
  var AC = window.AudioContext || window.webkitAudioContext, ctx = null;
  if (st.music !== 'ninguna' && AC) { try { ctx = new AC(); ctx.resume(); } catch (e) { ctx = null; } }
  var photos = ev.photos.filter(function(p){ return st.sel.indexOf(p.id) >= 0; }).sort(function(a, b){ return a.at - b.at; });
  st.step = 'make'; renderStory();
  var mine = run = {cancel: false, ctx: ctx, timer: null, rec: null};
  Promise.all(photos.map(function(p){
    return new Promise(function(res){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ res(null); }; im.src = p.data; });
  })).then(function(imgs){
    if (mine.cancel) return;
    var ps = [], ims = [];
    imgs.forEach(function(im, i){ if (im) { ims.push(im); ps.push(photos[i]); } });
    if (!ims.length) { toast('No se pudieron leer las fotos'); cancelRender(); return; }
    var cv = $('#st-cv'), x = cv.getContext('2d'), total = storyDur(ims.length);
    drawFrame(x, ims, ps, ev, 0);
    var stream = cv.captureStream(30), bus = null;
    if (ctx) {
      var dest = ctx.createMediaStreamDestination();
      bus = ctx.createGain(); bus.connect(dest); bus.connect(ctx.destination);
      dest.stream.getAudioTracks().forEach(function(tr){ stream.addTrack(tr); });
    }
    var mimes = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    var mime = mimes.filter(function(m){ try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } })[0] || '';
    var rec;
    try { rec = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: 4000000} : undefined); }
    catch (e) { toast('No se pudo iniciar la grabación'); cancelRender(); return; }
    var chunks = [];
    rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    rec.onerror = function(){ if (!mine.cancel) { toast('No se pudo crear el video'); cancelRender(); } };
    rec.onstop = function(){
      if (mine.cancel) return;
      var type = rec.mimeType || mime || 'video/webm';
      var blob = new Blob(chunks, {type: type});
      if (!blob.size) { toast('No se pudo crear el video'); cancelRender(); return; }
      st.result = {blob: blob, ext: type.indexOf('mp4') >= 0 ? 'mp4' : 'webm', url: URL.createObjectURL(blob), mb: (blob.size / 1048576).toFixed(1)};
      st.step = 'done'; run = null; renderStory();
    };
    mine.rec = rec;
    if (ctx) scheduleTrack(ctx, bus, st.music, total + 0.5, ctx.currentTime + 0.1);
    rec.start(500);
    var t0 = performance.now() + 100;
    mine.timer = setInterval(function(){
      var t = Math.max(0, (performance.now() - t0) / 1000);
      drawFrame(x, ims, ps, ev, Math.min(t, total));
      var pb = $('#st-prog i'); if (pb) pb.style.width = Math.min(100, t / total * 100) + '%';
      var tl = $('#st-time'); if (tl) tl.textContent = Math.min(Math.floor(t), Math.ceil(total)) + ' s de ' + Math.ceil(total) + ' s';
      if (t >= total) {
        clearInterval(mine.timer);
        setTimeout(function(){
          try { rec.stop(); } catch (e) {}
          if (ctx) { try { ctx.close(); } catch (e) {} }
        }, 350);
      }
    }, 33);
  });
}
function storyAct(a, t){
  var st = ui.story, ev;
  switch (a) {
    case 'story': openStory(); break;
    case 'st-close': closeStory(); break;
    case 'st-toggle':
      var id = t.dataset.id, i = st.sel.indexOf(id);
      if (i >= 0) { st.sel.splice(i, 1); t.classList.remove('sel'); t.setAttribute('aria-pressed', 'false'); }
      else if (st.sel.length >= SC.max) { toast('Máximo ' + SC.max + ' fotos'); return; }
      else { st.sel.push(id); t.classList.add('sel'); t.setAttribute('aria-pressed', 'true'); }
      stFoot();
      break;
    case 'st-none':
      st.sel = [];
      document.querySelectorAll('#story .cell').forEach(function(c){ c.classList.remove('sel'); c.setAttribute('aria-pressed', 'false'); });
      stFoot();
      break;
    case 'st-music':
      st.music = t.dataset.m; stopPreview();
      document.querySelectorAll('#story .cb').forEach(function(b){ b.classList.toggle('on', b === t); });
      break;
    case 'st-prev': togglePreview(); break;
    case 'st-go': startRender(); break;
    case 'st-cancel': cancelRender(); break;
    case 'st-again':
      if (st.result) { try { URL.revokeObjectURL(st.result.url); } catch (e) {} }
      st.result = null; st.step = 'pick'; renderStory();
      break;
    case 'st-save':
      ev = cur();
      if (dl && st.result) dl.save({filename: 'friends-party-' + slug(ev.name) + '.' + st.result.ext, data: st.result.blob}).then(function(){ toast('Video guardado'); }).catch(saveFail);
      break;
    case 'st-share':
      ev = cur();
      try {
        var file = new File([st.result.blob], 'friends-party-' + slug(ev.name) + '.' + st.result.ext, {type: st.result.blob.type});
        if (navigator.canShare && navigator.canShare({files: [file]})) {
          navigator.share({files: [file], title: ev.name, text: caption(ev)}).catch(function(e){ if (e && e.name !== 'AbortError') toast('No se pudo compartir. Guarda el video y súbelo desde la app.'); });
        } else toast('Compartir no está disponible aquí. Guarda el video y súbelo desde la app.');
      } catch (e) { toast('Compartir no está disponible aquí. Guarda el video y súbelo desde la app.'); }
      break;
    case 'st-copy':
      ev = cur();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(caption(ev)).then(function(){ toast('Texto copiado'); }, function(){ toast('No se pudo copiar el texto'); });
      else toast('No se pudo copiar el texto');
      break;
  }
}

function isoPlus(n){
  var d = new Date(); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysUntil(iso){
  if (!iso) return null;
  var p = iso.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]), n = new Date();
  return Math.round((d - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
}
function countdown(ev){
  var n = daysUntil(ev.date);
  if (n === null) return '';
  if (n > 1) return 'Faltan ' + n + ' días';
  if (n === 1) return 'Es mañana';
  if (n === 0) return 'Es hoy';
  return n === -1 ? 'Fue ayer' : 'Fue hace ' + (-n) + ' días';
}
function fmtHour(h){
  if (!h) return '';
  var p = h.split(':').map(Number), hh = p[0] % 12 || 12;
  return hh + ':' + String(p[1] || 0).padStart(2, '0') + (p[0] < 12 ? ' a. m.' : ' p. m.');
}
function fmtDay(iso){
  if (!iso) return '';
  var p = iso.split('-').map(Number);
  var s = new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('es', {weekday: 'long', day: 'numeric', month: 'long', year: p[0] !== new Date().getFullYear() ? 'numeric' : undefined});
  return s.charAt(0).toUpperCase() + s.slice(1);
}

}

    ? '<div class="ecover" style="background-image:url(' + top.data + ')"></div>'
    : themed

      : '<div class="ecover" style="background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')">' + ev.emoji + '</div>';
  var dt = '';
  if (ev.date) {
    var p = ev.date.split('-').map(Number), dd = new Date(p[0], p[1] - 1, p[2]);
    dt = '<small>' + esc(dd.toLocaleDateString('es', {weekday: 'short'}).replace('.', '')) + '</small><b>' + p[2] + '</b><small>' + esc(dd.toLocaleDateString('es', {month: 'short'}).replace('.', '') + ' ' + p[0]) + '</small>';
  } else dt = '<small>Sin</small><b>—</b><small>fecha</small>';
  var shown = ev.members.slice(0, 3), more = m - shown.length;

/* acciones del plan */
function planAct(a, t){
  var ev = cur();
  if (!ev) return;
  var nm, ph, mail, text;
  switch (a) {
    case 'pl-invite': ui.sheet = 'invite'; renderSheet(); break;
    case 'pl-remind': ui.sheet = 'remind'; renderSheet(); break;
    case 'pl-edit': ui.editId = ev.id; ui.sheet = 'new'; renderSheet(); break;
    case 'pl-rsvp':
      ev.rsvp[S.me] = t.dataset.s;
      if (ev.members.indexOf(S.me) < 0) ev.members.push(S.me);
      save(); render();
      break;
    case 'pl-rm': ev.remind[t.dataset.k] = !ev.remind[t.dataset.k]; save(); render(); break;
    case 'pl-copy': copyText(inviteText(ev), 'Mensaje copiado'); break;
    case 'pl-grp':
      ev.invites.push({id: uid(), who: t.dataset.n, via: 'app', at: Date.now()});
      if (ev.serverId) SB.syncInvite('event', ev.serverId, 'app', null);
      save(); render(); renderSheet(); toast(t.dataset.n + ' quedó invitado al evento');
      break;
    case 'pl-wa': case 'pl-mail': case 'pl-app':
      nm = ($('#i-name').value || '').trim();
      if (!nm) { toast('Escribe el usuario de tu amigo'); $('#i-name').focus(); return; }
      ph = ''; mail = '';
      text = inviteText(ev);
      if (a === 'pl-wa') { openLink('https://wa.me/' + ph + '?text=' + encodeURIComponent(text)); }
      else if (a === 'pl-mail') { openLink('mailto:' + mail + '?subject=' + encodeURIComponent('Te invito a ' + ev.name) + '&body=' + encodeURIComponent(text)); }
      ev.invites.push({id: uid(), who: nm, via: a === 'pl-wa' ? 'whatsapp' : a === 'pl-mail' ? 'correo' : 'app', at: Date.now()});
      if (ev.serverId) SB.syncInvite('event', ev.serverId, a === 'pl-wa' ? 'whatsapp' : a === 'pl-mail' ? 'correo' : 'app', a === 'pl-wa' ? ph : mail);
      save(); render();
      { var f1 = $('#i-name'); if (f1) f1.value = ''; }
      toast(a === 'pl-app' ? nm + ' quedó invitado en la app' : 'Invitación para ' + nm + ' registrada');
      { var f0 = $('#i-name'); if (f0) f0.focus(); }
      break;
    case 'pl-sim':
      if (!ev.invites.length) { toast('No hay invitaciones sin responder'); return; }
      var st = ['va', 'va', 'tal vez', 'no va'], last = '';
      ev.invites.forEach(function(v, i){
        var s = st[(i + Math.floor(Math.random() * 4)) % 4];
        if (ev.members.indexOf(v.who) < 0) ev.members.push(v.who);
        ev.rsvp[v.who] = s; last = v.who + ' respondió: ' + (s === 'va' ? 'va' : s === 'tal vez' ? 'tal vez' : 'no va');
      });
      ev.invites = []; save(); render(); toast(last);
      break;
  }
}

function loadScript(src){

    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);

}
var qrEncPromise = null, qrDecPromise = null;
function loadQrEncoder(){

  return qrEncPromise;
}
function loadQrDecoder(){
  if (typeof jsQR !== 'undefined') return Promise.resolve();
  if (qrDecPromise) return qrDecPromise;
  qrDecPromise = loadScript('jsQR.js').catch(function(e){ qrDecPromise = null; throw e; });
  return qrDecPromise;
}

  var m = /[?&]join=([^&]+)/.exec(window.location.search);

function clearJoinUrl(){

function afterJoinResult(r){

/* si venías de un enlace/QR con ?join=, se intenta apenas termina el login o la creación de cuenta;
   la sesión del servidor a veces llega un instante después, por eso reintenta unas pocas veces */
function tryPendingJoin(tries){
  if (!PENDING_JOIN) return;

    var code = PENDING_JOIN; PENDING_JOIN = ''; clearJoinUrl(); doJoin(code);

function decodeQrFile(file){
  return loadQrDecoder().then(function(){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onerror = rej;
      fr.onload = function(){
        var img = new Image();
        img.onerror = rej;
        img.onload = function(){
          var c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
          var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
          var data = ctx.getImageData(0, 0, c.width, c.height);
          var out = jsQR(data.data, c.width, c.height);
          if (out && out.data) res(out.data); else rej();
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  });
}

/* EXIF: lee la ubicación GPS guardada dentro de una foto JPEG (si el teléfono la incluyó) */
function exifGps(buf){
  try {
    var v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    var off = 2;
    while (off < v.byteLength - 4) {
      var marker = v.getUint16(off); off += 2;
      if (marker === 0xFFE1) {
        if (v.getUint32(off + 2) === 0x45786966) return tiffGps(v, off + 8);
        off += v.getUint16(off);
      } else if ((marker & 0xFF00) === 0xFF00) off += v.getUint16(off);
      else break;
    }
  } catch (e) {}
  return null;
}
function tiffGps(v, st){
  var le = v.getUint16(st) === 0x4949;
  var g16 = function(o){ return v.getUint16(o, le); }, g32 = function(o){ return v.getUint32(o, le); };
  if (g16(st + 2) !== 42) return null;
  var ifd = st + g32(st + 4), n = g16(ifd), gps = 0, i;
  for (i = 0; i < n; i++) { var e = ifd + 2 + i * 12; if (g16(e) === 0x8825) gps = st + g32(e + 8); }
  if (!gps) return null;
  var m = g16(gps), d = {};
  var rat = function(o){ return g32(o) / g32(o + 4); };
  for (i = 0; i < m; i++) {

/* coordenadas: enlaces de mapas o texto "lat, lon" */
function parseGeo(t){

/* plano esquemático (sin calles) */
function planoSVG(ev){
  var pts = [];
  if (ev.geo) pts.push({k: 'ev', g: ev.geo});
  ev.photos.forEach(function(p){ if (p.geo) pts.push({k: 'ph', g: p.geo, p: p}); });
  if (!pts.length) return '';
  var lat0 = pts[0].g.lat, lon0 = pts[0].g.lon, cl = Math.cos(lat0 * Math.PI / 180);
  pts.forEach(function(q){ q.mx = (q.g.lon - lon0) * 111320 * cl; q.my = (q.g.lat - lat0) * 110540; });
  var xs = pts.map(function(q){ return q.mx; }), ys = pts.map(function(q){ return q.my; });
  var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs), miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
  var W = 320, H = 230, cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
  var sc = Math.min((W - 70) / Math.max(maxx - minx, 60), (H - 70) / Math.max(maxy - miny, 60));
  var nice = [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000], target = 70 / sc, bar = nice[0], i;
  for (i = 0; i < nice.length; i++) if (nice[i] <= target) bar = nice[i];
  var out = '<svg class="plano" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Plano con la ubicación del evento y de las fotos"><rect width="' + W + '" height="' + H + '" rx="12" style="fill:var(--surface)"/>';
  for (i = 1; i < 8; i++) out += '<line x1="' + (i * W / 8) + '" y1="0" x2="' + (i * W / 8) + '" y2="' + H + '" style="stroke:var(--line)" stroke-width="1"/>';
  for (i = 1; i < 6; i++) out += '<line x1="0" y1="' + (i * H / 6) + '" x2="' + W + '" y2="' + (i * H / 6) + '" style="stroke:var(--line)" stroke-width="1"/>';
  pts.forEach(function(q){
    var x = W / 2 + (q.mx - cx) * sc, y = H / 2 - (q.my - cy) * sc;
    if (q.k === 'ph') out += '<g data-act="photo" data-id="' + q.p.id + '" style="cursor:pointer"><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="13" fill="transparent"/><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="7" fill="#1F9E89" stroke="#fff" stroke-width="2"/></g>';
  });
  pts.forEach(function(q){
    if (q.k !== 'ev') return;
    var x = W / 2 + (q.mx - cx) * sc, y = H / 2 - (q.my - cy) * sc;
    out += '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"><path d="M0 0C-9-10-13-16-13-22a13 13 0 0 1 26 0C13-16 9-10 0 0z" fill="#D6336C" stroke="#fff" stroke-width="2"/><circle cy="-22" r="5" fill="#fff"/></g>';
  });
  out += '<g transform="translate(18 26)" style="fill:var(--muted)"><path d="M0-14L6 0H-6z"/><text y="16" text-anchor="middle" font-size="11" font-family="Bricolage Grotesque,system-ui,sans-serif">N</text></g>';
  var bl = bar * sc;
  out += '<g transform="translate(' + (W - 20 - bl).toFixed(1) + ' ' + (H - 18) + ')" style="stroke:var(--muted);fill:var(--muted)"><path d="M0 0H' + bl.toFixed(1) + 'M0-4V4M' + bl.toFixed(1) + '-4V4" fill="none" stroke-width="2"/><text x="' + (bl / 2).toFixed(1) + '" y="-8" text-anchor="middle" font-size="11" stroke="none" font-family="Bricolage Grotesque,system-ui,sans-serif">' + (bar >= 1000 ? (bar / 1000) + ' km' : bar + ' m') + '</text></g></svg>';
  return out;
}

function placeAct(a, t){

function fotosAct(a, t){
  var ev = cur(), list, i;
  switch (a) {
    case 'fo-open': ui.view = 'event'; ui.eid = t.dataset.id; ui.tab = 'fotos'; ui.fsel = null; ui.from = 'fotos'; render(false); window.scrollTo(0, 0); break;
    case 'fo-upload': ui.eid = t.dataset.id; $('#file').click(); break;
    case 'fo-select': ui.fsel = []; render(); break;
    case 'fo-cancel': ui.fsel = null; render(); break;
    case 'fo-all': if (ev) { ui.fsel = ev.photos.map(function(p){ return p.id; }); render(); } break;
    case 'fo-toggle':
      if (!ui.fsel) return;
      i = ui.fsel.indexOf(t.dataset.id);
      if (i >= 0) ui.fsel.splice(i, 1); else ui.fsel.push(t.dataset.id);
      t.classList.toggle('sel', i < 0); t.setAttribute('aria-pressed', i < 0);
      foFoot();
      break;
    case 'fo-dlsel': if (ev) downloadMany(ev, selPhotos(ev)); break;
    case 'fo-sharesel': if (ev) { list = selPhotos(ev); if (list.length) shareFiles(ev, list); } break;
  }
}

function userFrom(name){
  var u = String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '');
  return (u.length >= 3 ? u : (u + 'usuario')).slice(0, 20);
}
function ensureProfile(){
  if (S.me && !S.profile) S.profile = {name: S.me, user: userFrom(S.me), email: '', phone: '', bio: '', photo: '', created: Date.now()};
}
function renameMe(o, n){
  if (o === n) return;
  S.events.forEach(function(ev){
    ev.members = ev.members.map(function(m){ return m === o ? n : m; }).filter(function(m, i, a){ return a.indexOf(m) === i; });
    if (ev.rsvp && ev.rsvp[o] !== undefined) { ev.rsvp[n] = ev.rsvp[o]; delete ev.rsvp[o]; }
    ev.photos.forEach(function(p){ if (p.by === o) p.by = n; });
    ev.chat.forEach(function(m){ if (m.by === o) m.by = n; });
    (ev.songs || []).forEach(function(s){ if (s.by === o) s.by = n; s.likes = s.likes.map(function(l){ return l === o ? n : l; }); });
  });
  S.me = n;
  renameSocial(o, n);
}
function squarePhoto(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ rej(); };
      img.onload = function(){
        var s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 256;
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* red social de ejemplo (todo vive en este teléfono) */
function ensureSocial(){
  if (!S.social) S.social = {following: [], followers: [], graph: {}};
}
function followersOf(n){
  if (n === S.me) return S.social.followers.slice();
  var out = Object.keys(S.social.graph).filter(function(k){ return S.social.graph[k].indexOf(n) >= 0; });
  if (S.social.following.indexOf(n) >= 0 && out.indexOf(S.me) < 0) out.push(S.me);
  return out;
}
function followingOf(n){
  if (n === S.me) return S.social.following.slice();
  var out = (S.social.graph[n] || []).slice();
  if (S.social.followers.indexOf(n) >= 0 && out.indexOf(S.me) < 0) out.push(S.me);
  return out;
}
function isFollowing(n){ return S.social.following.indexOf(n) >= 0; }
function renameSocial(o, n){
  var sw = function(arr){ return arr.map(function(x){ return x === o ? n : x; }).filter(function(x, i, a){ return a.indexOf(x) === i; }); };
  if (S.social) {
    S.social.following = sw(S.social.following); S.social.followers = sw(S.social.followers);
    Object.keys(S.social.graph).forEach(function(k){ S.social.graph[k] = sw(S.social.graph[k]); });
  }
  S.events.forEach(function(ev){ ev.photos.forEach(function(p){ if (p.likes) p.likes = sw(p.likes); }); });
  if (S.group && S.group.chat) S.group.chat.forEach(function(m){ if (m.by === o) m.by = n; });
}

/* datos de una persona con lo que hay en este teléfono */
function personData(name){
  var photos = [], evs = [], likes = 0;
  S.events.forEach(function(ev){
    if (ev.members.indexOf(name) >= 0) evs.push(ev);
    ev.photos.forEach(function(p){ if (p.by === name) { photos.push({ev: ev, p: p}); likes += (p.likes || []).length; } });
  });
  photos.sort(function(a, b){ return b.p.at - a.p.at; });
  return {photos: photos, evs: evs, likes: likes, followers: followersOf(name), following: followingOf(name)};
}
