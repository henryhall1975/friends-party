   marcaste "Voy" Y subiste al menos una foto (la foto es la prueba de que sí fuiste) ---------- */
var PARTY_LEVELS = [
  {min: 1, img: 'badges/party-rookie.png', n: 'Party Rookie', d: 'Empezando'},
  {min: 3, img: 'badges/party-baby.png', n: 'Party Baby', d: 'Ya entró al ambiente'},
  {min: 7, img: 'badges/party-young.png', n: 'Party Young', d: 'Ya sabe cómo va la cosa'},
  {min: 12, img: 'badges/party-lover.png', n: 'Party Lover', d: 'Le encanta salir'},
  {min: 16, img: 'badges/party-animal.png', n: 'Party Animal', d: 'Nivel serio de fiesta'},
  {min: 25, img: 'badges/party-legend.png', n: 'Party Legend', d: 'Veterano de Friends Party'},
  {min: 40, img: 'badges/party-master.png', n: 'Party Master', d: 'Nivel élite'},
  {min: 60, img: 'badges/party-icon.png', n: 'Party Icon', d: 'Máximo estatus'}
];
function partyCount(name){
  var n = 0;
  S.events.forEach(function(ev){
    var fue = (ev.rsvp && ev.rsvp[name] || 'va') === 'va';
    if (fue && ev.photos.some(function(p){ return p.by === name; })) n++;
  });
  /* el nivel nunca baja: se guarda el máximo alcanzado (borrar una foto o cambiar a "No voy" no te quita lo ganado) */
  if (name === S.me) { if (n > (S.partyBest || 0)) { S.partyBest = n; S.partyDirty = true; } return Math.max(n, S.partyBest || 0); }
  return n;
}
/* pantalla de celebración al subir de nivel: trofeo + explosión de confeti */
function levelIdx(count){ var k = -1; for (var i = 0; i < PARTY_LEVELS.length; i++) if (count >= PARTY_LEVELS[i].min) k = i; return k; }
function checkLevelUp(){
  if (!S.me) return;
  var now = levelIdx(partyCount(S.me));
  if (S.partyDirty) { S.partyDirty = false; save(); }
  if (S.celebLvl === undefined) { S.celebLvl = now; save(); return; }
  if (now > S.celebLvl) { S.celebLvl = now; save(); showLevelUp(PARTY_LEVELS[now]); }
}
var confRaf = 0;
function showLevelUp(lv){
  var el = document.getElementById('lvlup');
  if (!el) { el = document.createElement('div'); el.id = 'lvlup'; document.body.appendChild(el); }
  el.innerHTML = '<canvas id="lvl-cv"></canvas><div class="lv-box"><div class="lv-k">¡Subiste de nivel!</div><img class="lv-img" src="' + lv.img + '" alt="' + esc(lv.n) + '"><div class="lv-n">' + esc(lv.n) + '</div><div class="lv-d">' + esc(lv.d) + '</div><button class="tr-cta" id="lv-ok">¡Genial!</button></div>';
  el.className = 'on';
  document.getElementById('lv-ok').onclick = function(){ cancelAnimationFrame(confRaf); el.className = ''; el.innerHTML = ''; };
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('lvl-cv'), W = cv.width = innerWidth, H = cv.height = innerHeight, x = cv.getContext('2d');
  var C = ['#ff5fd0', '#ffd166', '#5b8cff', '#7cf5c0', '#ff8a5b', '#b38bff', '#ffffff'], P = [];
  function burst(cx, cy, n){ for (var i = 0; i < n; i++) { var a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 12; P.push({x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, w: 6 + Math.random() * 7, h: 9 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: C[i % C.length], life: 1}); } }
  burst(W / 2, H * .42, 170);
  setTimeout(function(){ burst(W * .2, H * .5, 70); burst(W * .8, H * .5, 70); }, 350);
  setTimeout(function(){ burst(W / 2, H * .35, 90); }, 800);
  (function tick(){
    x.clearRect(0, 0, W, H);
    P.forEach(function(q){ q.vy += .28; q.vx *= .992; q.x += q.vx; q.y += q.vy; q.r += q.vr; if (q.y > H) q.life = 0;
      x.save(); x.translate(q.x, q.y); x.rotate(q.r); x.fillStyle = q.c; x.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); x.restore(); });
    P = P.filter(function(q){ return q.life; });
    if (P.length || document.getElementById('lv-ok')) confRaf = requestAnimationFrame(tick);
  })();
}
function partyLevel(count){
  var lvl = null;
  for (var i = 0; i < PARTY_LEVELS.length; i++) if (count >= PARTY_LEVELS[i].min) lvl = PARTY_LEVELS[i];
  return lvl;
}
function nextLevel(count){
  for (var i = 0; i < PARTY_LEVELS.length; i++) if (PARTY_LEVELS[i].min > count) return PARTY_LEVELS[i];
  return null;
}

ui.authed = false; ui.fails = 0; ui.failUntil = 0; ui.afterLogin = ''; ui.lgProv = '';

function hasLock(){
  return !!(S.me && S.profile && ((S.lock && (S.lock.pw || S.lock.bio)) || S.profile.provider));
}
function b64(buf){ var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
function unb64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function randBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }

/* la contraseña nunca se guarda como texto: solo su huella (PBKDF2) */
function hashPw(pw, saltB64, iter){
  var salt = saltB64 ? unb64(saltB64) : randBytes(16), n = iter || 150000;
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function(key){
    return crypto.subtle.deriveBits({name: 'PBKDF2', salt: salt, iterations: n, hash: 'SHA-256'}, key, 256);
  }).then(function(bits){ return {salt: b64(salt), hash: b64(bits), iter: n}; });
}
function verifyPw(pw){
  var L = S.lock && S.lock.pw;
  if (!L) return Promise.resolve(false);
  return hashPw(pw, L.salt, L.iter).then(function(h){ return h.hash === L.hash; });
}
function finishSignup(name, user, email, phone, bio, prov, h, pwd){
  S.me = name;
  S.profile = {name: name, user: user, email: email, phone: phone, bio: bio, photo: ui.acctPhoto || '', provider: prov, created: Date.now()};
  S.lock = {pw: h, bio: null};

  toast('Cuenta creada. ¡Bienvenido, ' + name + '!');

  if (email && pwd) {
    SB.signUp(email, pwd).then(function(res){
      if (res.ok && res.data && res.data.user) {
        SB.remember({access_token: res.data.access_token, refresh_token: res.data.refresh_token});
        S.serverId = res.data.user.id; save();
        tryPendingJoin();
        SB.ensureGroup().then(function(){ return SB.fetchGroupCode(); });
        return SB.upsertProfile(res.data.user.id, user, name, bio);
      }
    }).catch(function(){ /* sin conexión: la cuenta sigue funcionando en este teléfono */ });

}

/* Face ID / Touch ID (huella o rostro en Android) mediante el navegador */
function bioSupported(){
  return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && navigator.credentials.get && window.crypto);
}
function bioFail(){ toast('No se pudo confirmar con Face ID o Touch ID. Puede que esta vista no lo permita: usa tu contraseña.'); }
function enableBio(){
  if (!bioSupported()) { toast('Este dispositivo no permite Face ID o Touch ID desde aquí.'); return; }
  navigator.credentials.create({publicKey: {
    challenge: randBytes(32), rp: {name: 'Friends Party'},
    user: {id: new TextEncoder().encode(S.profile.user || S.me), name: S.profile.email || S.profile.user, displayName: S.me},
    pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
    authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required'}, timeout: 60000, attestation: 'none'
  }}).then(function(c){
    S.lock = S.lock || {pw: null, bio: null}; S.lock.bio = b64(c.rawId); save(); render();
    toast('Face ID o Touch ID activado en este teléfono');
  }).catch(bioFail);
}
function bioLogin(){
  if (!bioSupported() || !S.lock || !S.lock.bio) { bioFail(); return; }
  navigator.credentials.get({publicKey: {
    challenge: randBytes(32), allowCredentials: [{type: 'public-key', id: unb64(S.lock.bio)}], userVerification: 'required', timeout: 60000
  }}).then(loginOk).catch(bioFail);
}

/* acciones */
function loginAct(a, t){
  var pw, id, ok;
  if (a !== 'lg-wipe') { if (ui.armed === 'lgwipe') { ui.armed = null; } }

    case 'lg-pw':

      verifyPw(pw).then(function(good){
        ok = good && (id === (S.profile.email || '').toLowerCase() || id === S.profile.user);
        if (ok) {
          loginOk();
          if (S.profile.email) SB.signIn(S.profile.email, pw).then(function(res){
            if (res.ok && res.data && res.data.access_token) SB.remember({access_token: res.data.access_token, refresh_token: res.data.refresh_token});
          }).catch(function(){});
          return;
        }

        else toast('El correo o la contraseña no coinciden');

  if (m.img) return {data: m.img};
  if (!m.photoId) return null;
  var e = m.evId ? S.events.filter(function(x){ return x.id === m.evId; })[0] : def;
  var p = e && e.photos.filter(function(x){ return x.id === m.photoId; })[0];
  return p ? {data: p.data, evId: e.id, id: p.id} : {gone: true};
}
function bubbles(msgs, def){
  if (!msgs.length) return '<div class="empty"><p><strong>Nadie ha escrito todavía.</strong></p><p class="muted">Escribe el primer mensaje.</p></div>';
  return '<div class="msgs">' + msgs.map(function(m){
    var mine = m.by === S.me, ph = photoOf(m, def), pic = '';
    if (ph) {
      if (ph.gone) pic = '<em>Foto eliminada</em>';
      else if (ph.id) pic = '<button class="mph" data-act="ch-photo" data-e="' + ph.evId + '" data-id="' + ph.id + '" aria-label="Abrir foto"><img src="' + ph.data + '" alt="Foto compartida"></button>';
      else pic = '<div class="mph"><img src="' + ph.data + '" alt="Foto enviada"></div>';
    }
    return '<div class="msg' + (mine ? ' me' : '') + '">' + (mine ? '' : '<div class="who">' + esc(m.by) + '</div>') + '<div class="bub">' + pic + (m.text ? '<div>' + esc(m.text) + '</div>' : '') + '<time>' + hhmm(m.at) + '</time></div></div>';
  }).join('') + '</div>';
}
function chatBody(ev){ markRead(ev.id); return bubbles(ev.chat, ev); }
function composer(id, draft, sendAct, k){
  return '<div class="bar"><div class="wrap comp"><button class="btn sq" data-act="ch-attach" data-k="' + k + '" aria-label="Enviar una foto">' + I.image + '</button><input id="' + id + '" class="inp" placeholder="Escribe un mensaje" aria-label="Mensaje" autocomplete="off" value="' + esc(draft) + '"><button class="btn primary sq" data-act="' + sendAct + '" aria-label="Enviar">' + I.send + '</button></div></div>';
}

/* bandeja de conversaciones */
function chatsView(){
  var cs = convs().sort(function(a, b){ return lastAt(b) - lastAt(a); });
  var rows = cs.map(function(c){
    var m = c.msgs[c.msgs.length - 1], u = unreadOf(c);
    var prev = m ? (m.by === S.me ? 'Tú: ' : m.by + ': ') + (m.text || '📷 Foto') : 'Sin mensajes todavía';
    var g = c.kind === 'group' ? ['#D6336C', '#7B4FD1'] : GR[c.ev.grad % GR.length];
    return '<li class="lnk"><button class="rowbtn" data-act="ch-open" data-k="' + c.id + '"><span class="evi" style="background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')">' + (c.kind === 'group' ? '👥' : c.ev.emoji) + '</span>' +
      '<span class="nm">' + esc(c.name) + '<small>' + esc(prev) + '</small></span><span class="cmeta">' + esc(whenLbl(m ? m.at : 0)) + (u ? '<b class="ub">' + u + '</b>' : '') + '</span></button></li>';
  }).join('');
  return '<header class="top"><div class="wrap"><div class="bar1"><button class="ib" data-act="back" aria-label="Volver al inicio">' + I.back + '</button><div class="tt"><div class="ttl">Chat</div><div class="meta"><span>Tu grupo y cada evento</span></div></div></div></div></header>' +
    '<main class="wrap"><ul class="people" style="margin-top:6px">' + rows + '</ul></main>';
}
function gchatView(){
  var g = S.group; markRead('g');
  var n = g.members.length + 1;
  return '<header class="top"><div class="wrap"><div class="bar1"><button class="ib" data-act="ch-back" aria-label="Volver a los chats">' + I.back + '</button><div class="tt"><div class="ttl">👥 Mi grupo</div><div class="meta"><span>' + n + ' personas</span></div></div></div></div></header>' +
    '<main class="wrap">' + bubbles(g.chat, null) + '</main>' + composer('gchatin', ui.gdraft, 'ch-send', 'g');
}

/* hoja para enviar una foto */
function pickTarget(){
  var k = ui.pick && ui.pick.k;
  if (k === 'g') return S.group.chat;
  var ev = S.events.filter(function(e){ return e.id === (ui.pick && ui.pick.evId); })[0];
  return ev ? ev.chat : null;
}
function pickSheet(){
  var k = ui.pick && ui.pick.k, ps = [];
  if (k === 'g') { S.events.forEach(function(ev){ ev.photos.forEach(function(p){ ps.push({ev: ev, p: p}); }); }); }
  else { var ev = S.events.filter(function(e){ return e.id === ui.pick.evId; })[0]; if (ev) ev.photos.forEach(function(p){ ps.push({ev: ev, p: p}); }); }
  ps.sort(function(a, b){ return b.p.at - a.p.at; }); ps = ps.slice(0, 30);
  return '<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Enviar una foto"><h2>Enviar una foto</h2>' +
    '<button class="btn block" data-act="ch-gallery">' + I.image + ' Elegir de mi galería</button>' +
    (ps.length ? '<p class="muted small">O elige una foto de tus álbumes</p><div class="grid pickgrid">' + ps.map(function(r){
      return '<button class="cell" data-act="ch-pick" data-e="' + r.ev.id + '" data-id="' + r.p.id + '" aria-label="Foto de ' + esc(r.p.by) + '"><img loading="lazy" src="' + r.p.data + '" alt=""></button>';
    }).join('') + '</div>' : '<p class="muted small">Todavía no hay fotos en los álbumes.</p>') +
    '<button class="link" data-act="close-sheet">Cancelar</button></div>';
}

function chatAct(a, t){
  var target, m;
  switch (a) {
    case 'ch-open':
      if (t.dataset.k === 'g') { ui.view = 'gchat'; ui.stick = true; render(false); }
      else { ui.from = 'chats'; ui.view = 'event'; ui.eid = t.dataset.k; ui.tab = 'chat'; ui.stick = true; ui.fsel = null; render(false); }
      break;
    case 'ch-back': ui.view = 'chats'; render(false); window.scrollTo(0, 0); break;
    case 'ch-send':
      var txt = (ui.gdraft || '').trim(); if (!txt) return;
      S.group.chat.push({id: uid(), by: S.me, at: Date.now(), text: txt});
      SB.ensureGroup().then(function(gid){ if (gid) SB.syncMessage({text: txt, groupId: gid}); });
      ui.gdraft = ''; ui.stick = true; save(); render(false);
      var ci = $('#gchatin'); if (ci) ci.focus();
      break;
    case 'ch-attach': ui.pick = {k: t.dataset.k, evId: t.dataset.k === 'ev' ? ui.eid : null}; ui.sheet = 'chatpick'; renderSheet(); break;
    case 'ch-gallery': $('#cfile').click(); break;
    case 'ch-pick':
      target = pickTarget(); if (!target) return;
      target.push({id: uid(), by: S.me, at: Date.now(), text: '', photoId: t.dataset.id, evId: t.dataset.e});
      ui.sheet = null; ui.pick = null; ui.stick = true; renderSheet(); save(); render(false); toast('Foto enviada');
      break;
    case 'ch-photo': ui.eid = t.dataset.e; ui.lb = t.dataset.id; renderLb(); break;
    case 'ch-sim':
      var pool = ['José', 'Ana', 'Luis', 'Marta'].filter(function(n){ return n !== S.me; });
      var w1 = pool[Math.floor(Math.random() * pool.length)], w2 = pool[Math.floor(Math.random() * pool.length)];
      S.group.chat.push({id: uid(), by: w1, at: Date.now(), text: PHRASES[Math.floor(Math.random() * PHRASES.length)]});
      var ev = S.events.slice().sort(function(a, b){ return lastAt({msgs: b.chat}) - lastAt({msgs: a.chat}); })[0];
      if (ev) ev.chat.push({id: uid(), by: w2, at: Date.now() + 1, text: PHRASES[Math.floor(Math.random() * PHRASES.length)]});
      save(); render();
      toast(w1 + ' escribió en Mi grupo' + (ev ? ' y ' + w2 + ' en ' + ev.name : ''));
      break;
  }
}

/* foto desde la galería del teléfono */
$('#cfile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f || !/^image\//.test(f.type) || !ui.pick) return;
  var target = pickTarget();
  if (!target) return;
  readImage(f).then(function(d){
    target.push({id: uid(), by: S.me, at: Date.now(), text: '', img: d});
    ui.sheet = null; ui.pick = null; ui.stick = true; renderSheet(); save(); render(false); toast('Foto enviada');
  }, function(){ toast('No se pudo leer esa foto'); });
});

/* ---------- inicio ---------- */
coverOn = true; renderCover();
Promise.race([load(), new Promise(function(r){ setTimeout(function(){ r(null); }, 1500); })]).then(function(st){
  if (st && typeof st === 'object') S = Object.assign(S, st);
  ensureProfile(); ensureDemos();
  if (!S.me) { ui.acctPhoto = ''; ui.sheet = 'acct'; }
  else {
    /* este teléfono ya tiene una cuenta: nada de portada ni de tutorial otra vez,
       directo a iniciar sesión (con Face ID o Touch ID al frente, si ya lo activó) */
    coverOn = false;
    if (hasLock()) ui.sheet = 'login'; else ui.authed = true;
  }
  render(false); renderSheet(); renderCover();
  if (PENDING_JOIN && !S.me) toast('Alguien te invitó a Friends Party. Crea tu cuenta o inicia sesión para unirte.');
  if (PENDING_JOIN && APPSTORE_URL && !(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) && /iphone|ipad|ipod/i.test(navigator.userAgent) && !/FriendsPartyApp/i.test(navigator.userAgent)) {
    var bn = document.createElement('a'); bn.className = 'getapp'; bn.href = APPSTORE_URL; bn.textContent = 'Descarga Friends Party en el App Store para unirte'; document.body.appendChild(bn);
  }
  SB.restore().then(function(ok){ if (ok) { SB.syncPending(); tryPendingJoin(); SB.ensureGroup().then(function(){ return SB.fetchGroupCode(); }); } }); /* recupera la sesión y reintenta lo pendiente */
  setTimeout(loadStickers, 4000); /* los stickers no hacen falta al abrir la app: se piden en segundo plano, sin competir con lo primero que se ve */
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function(d){ if (d) { dl = d; render(); } }).catch(function(){});
    }
  } catch (_) {}
});
window.__t = {S: S, ui: ui, SB: SB, finishSignup: finishSignup, loginAct: loginAct};
})();
</script>
</body>
